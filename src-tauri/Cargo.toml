[package]
name = "mdlyx"
version = "0.1.2"
description = "Desktop shell for the MdLyx mathematical research editor"
authors = ["MdLyx contributors"]
repository = "https://github.com/sfuchs-de/mdlyx"
publish = false
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mdlyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
keyring = { version = "3.6", features = ["apple-native"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
