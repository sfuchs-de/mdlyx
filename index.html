<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EE" />
    <script type="module" src="./src/theme-bootstrap.ts"></script>
    <meta name="application-name" content="MdLyx" />
    <meta name="description" content="A mathematical Markdown editor with linked research libraries." />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" href="./mdlyx-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./site.webmanifest" />
    <title>MdLyx</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span class="brand">MdLyx</span>
        <div class="tb-file">
          <button id="btn-file" type="button" aria-haspopup="menu" aria-controls="file-menu" aria-expanded="false">File ▾</button>
          <div id="file-menu" class="menu" role="menu" hidden>
            <button id="btn-new" type="button" role="menuitem">New</button>
            <button id="btn-open" type="button" role="menuitem">
              <span>Open</span><kbd>⌘O</kbd>
            </button>
            <button id="btn-save" type="button" role="menuitem">
              <span>Save</span><kbd>⌘S</kbd>
            </button>
            <button id="btn-save-as" type="button" role="menuitem">
              <span>Save As</span><kbd>⇧⌘S</kbd>
            </button>
            <div class="menu-sep"></div>
            <button id="btn-export-tex" type="button" role="menuitem">Export TeX</button>
          </div>
        </div>
        <span id="file-status" class="status" role="status" aria-live="polite" aria-atomic="true" title="Document: untitled.md. Destination: browser recovery. Not yet saved." aria-label="Document: untitled.md. Destination: browser recovery. Not yet saved.">Changes pending</span>
        <div class="tb-toggles">
          <button id="btn-project-search" type="button" class="icon-btn" title="Search projects" aria-label="Search projects">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><line x1="10.2" y1="10.2" x2="13.6" y2="13.6"/></svg>
          </button>
          <button id="btn-scholarly" type="button" class="icon-btn" title="References and publication" aria-label="References and publication">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.8h7.2c1 0 1.8.8 1.8 1.8v8.6H4.8C3.8 13.2 3 12.4 3 11.4z"/><path d="M4.8 10.2H12"/><path d="M6 5.5h3.8M6 7.5h2.7"/></svg>
          </button>
          <button id="btn-table" type="button" class="icon-btn" title="Table tools" aria-label="Table tools">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1"/><line x1="2.5" y1="6.4" x2="13.5" y2="6.4"/><line x1="6.2" y1="3" x2="6.2" y2="13"/><line x1="9.9" y1="3" x2="9.9" y2="13"/></svg>
          </button>
          <button id="btn-outline" type="button" class="icon-btn" title="Outline and find" aria-label="Outline and find">
            <svg viewBox="0 0 16 16" aria-hidden="true"><line x1="3" y1="4" x2="13" y2="4"/><line x1="5" y1="8" x2="13" y2="8"/><line x1="7" y1="12" x2="13" y2="12"/></svg>
          </button>
          <button id="btn-library" type="button" class="icon-btn" title="Library" aria-label="Library" aria-controls="library" aria-expanded="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><line x1="6.5" y1="3" x2="6.5" y2="13"/></svg>
          </button>
          <button id="btn-comments" type="button" class="icon-btn" title="Comments" aria-label="Comments" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.2c0-.9.7-1.7 1.6-1.7h7.8c.9 0 1.6.8 1.6 1.7v3.9c0 .9-.7 1.7-1.6 1.7H6.5L3.5 13v-2.5c-.6-.2-1-.8-1-1.4z"/></svg>
          </button>
          <button id="btn-info" type="button" class="icon-btn" title="Document properties" aria-label="Document properties">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><line x1="8" y1="7.4" x2="8" y2="11"/><circle cx="8" cy="4.9" r="0.5" fill="currentColor" stroke="none"/></svg>
          </button>
          <button id="btn-guide" type="button" class="icon-btn" title="Writing guide (F1)" aria-label="Writing guide">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M6.4 5.8a1.8 1.8 0 0 1 3.4.8c0 1.4-1.8 1.6-1.8 2.8"/><circle cx="8" cy="11.5" r="0.45" fill="currentColor" stroke="none"/></svg>
          </button>
          <button id="btn-config" type="button" class="icon-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" aria-hidden="true"><line x1="2.5" y1="5.5" x2="13.5" y2="5.5"/><circle cx="6" cy="5.5" r="1.7"/><line x1="2.5" y1="10.5" x2="13.5" y2="10.5"/><circle cx="10" cy="10.5" r="1.7"/></svg>
          </button>
          <div class="tb-tools-more" hidden>
            <button id="btn-tools-more" type="button" class="icon-btn" title="More tools" aria-label="More tools" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.2" cy="8" r="0.8" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="0.8" fill="currentColor" stroke="none"/><circle cx="12.8" cy="8" r="0.8" fill="currentColor" stroke="none"/></svg>
            </button>
            <div id="tools-more-menu" class="menu tb-tools-more-menu" role="menu" hidden></div>
          </div>
        </div>
      </header>
      <div id="workspace">
        <aside id="library" aria-label="Document library"></aside>
        <button id="library-scrim" type="button" aria-label="Close document library" hidden></button>
        <div id="editor-pane">
          <nav id="tab-bar" aria-label="Open documents"></nav>
          <main id="editor-host"></main>
          <section id="project-overview" role="main" aria-label="Project overview" hidden></section>
          <section id="project-graph" role="main" aria-label="Project dependency graph" hidden></section>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
